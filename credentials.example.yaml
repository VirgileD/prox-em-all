# prox-em-all credentials example: the real credentials replacing placeholders in HTTPS requests.
# See "Credential injection" in README.md.
#
# This file holds secrets: never install it in clear. Encrypt it for systemd, then delete it:
#   sudo systemd-creds encrypt --name=credentials credentials.yaml /etc/prox-em-all/credentials.cred
#   shred -u credentials.yaml
# The service loads it with LoadCredentialEncrypted=credentials:/etc/prox-em-all/credentials.cred
# (see prox-em-all.service). Unknown settings are rejected.

# CA signing the certificates presented to the clients for the servers below, in PEM. The clients
# must trust caCertificate; keep caKey secret, as it can impersonate any server to them.
caCertificate: |
  -----BEGIN CERTIFICATE-----
  ... paste ca.crt here ...
  -----END CERTIFICATE-----
caKey: |
  -----BEGIN PRIVATE KEY-----
  ... paste ca.key here ...
  -----END PRIVATE KEY-----

# Servers whose requests get their credentials replaced. Connections to other servers are not
# decrypted. Default: none
#
# host: the server name the clients ask for (TLS SNI), matched exactly, ignoring case.
# port: its TCP port, which must be in proxyPorts. Default: 443
# replacements: in the request header named header, every occurrence of placeholder is replaced
#   by value. Requests without the placeholder are forwarded unchanged.
servers:
  - host: api.github.com
    replacements:
      # The client sends "Authorization: Bearer PLACEHOLDER_GITHUB_TOKEN".
      - header: Authorization
        placeholder: PLACEHOLDER_GITHUB_TOKEN
        value: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  - host: internal-api.example.com
    port: 8443
    replacements:
      # An API key header, and a session cookie among other cookies.
      - header: X-Api-Key
        placeholder: PLACEHOLDER_API_KEY
        value: real-api-key
      - header: Cookie
        placeholder: PLACEHOLDER_SESSION
        value: real-session-id
