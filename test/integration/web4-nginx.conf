# HTTPS server of the integration test: answers "authorized" to the real token only.
daemon off;
pid /tmp/nginx.pid;
error_log stderr;
events {}
http {
    access_log /dev/stdout;
    server {
        listen 443 ssl;
        ssl_certificate /etc/web4/tls/web4.crt;
        ssl_certificate_key /etc/web4/tls/web4.key;
        default_type text/plain;
        location / {
            if ($http_authorization = "Bearer real-token") {
                return 200 "authorized\n";
            }
            return 401 "denied\n";
        }
    }
}
