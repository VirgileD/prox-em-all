name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make integration-test
